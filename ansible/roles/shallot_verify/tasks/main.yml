---
- name: Reconfirm the local-only verification boundary
  ansible.builtin.assert:
    that:
      - shallot_verify_local_only | bool
      - (ansible_connection | default('')) == 'local'
      - not (shallot_verify_external_bootstrap_enabled | bool)
    fail_msg: Verification may not target external hosts or enable bootstrap.

- name: Inspect rootless Podman for verification
  ansible.builtin.command:
    argv: [podman, info, --format, json]
  register: shallot_verify_podman_command
  changed_when: false
  failed_when: false

- name: Require a healthy rootless Podman session
  ansible.builtin.assert:
    that:
      - shallot_verify_podman_command.rc == 0
      - (shallot_verify_podman_command.stdout | from_json).host.security.rootless | bool
    fail_msg: Rootless Podman verification failed.

- name: Inspect optional local Ansible secrets file
  ansible.builtin.stat:
    path: "{{ shallot_verify_secrets_file }}"
  register: shallot_verify_secrets_stat

- name: Inspect optional Compose environment file
  ansible.builtin.stat:
    path: "{{ shallot_verify_compose_env_file }}"
  register: shallot_verify_compose_env_stat

- name: Inspect optional Wazuh internal users file
  ansible.builtin.stat:
    path: "{{ shallot_verify_wazuh_internal_users_file }}"
  register: shallot_verify_wazuh_internal_users_stat

- name: Require restrictive permissions for local secret files
  ansible.builtin.assert:
    that:
      - item.stat.mode in ['0400', '0600']
    fail_msg: "{{ item.stat.path }} must be readable only by its owner."
  loop:
    - "{{ shallot_verify_secrets_stat }}"
    - "{{ shallot_verify_compose_env_stat }}"
    - "{{ shallot_verify_wazuh_internal_users_stat }}"
  when: item.stat.exists
  no_log: true

- name: Run immutable runtime policy verification
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ shallot_verify_policy_script }}"
      - --json
  register: shallot_verify_policy_result
  changed_when: false
  failed_when: false

- name: Parse runtime policy findings
  ansible.builtin.set_fact:
    shallot_verify_runtime_findings: >-
      {{ (shallot_verify_policy_result.stdout | from_json)['errors'] }}
  when: (shallot_verify_policy_result.stdout | trim).startswith('{')

- name: Record policy execution failure
  ansible.builtin.set_fact:
    shallot_verify_runtime_findings:
      - Runtime policy verifier failed before returning structured output
  when: not (shallot_verify_policy_result.stdout | trim).startswith('{')

- name: Enforce runtime policy
  ansible.builtin.assert:
    that:
      - shallot_verify_policy_result.rc == 0
      - shallot_verify_runtime_findings | length == 0
    fail_msg: "Runtime-policy findings: {{ shallot_verify_runtime_findings }}"
  when: shallot_verify_enforce_runtime_policy | bool

- name: Collect local listening sockets without changing the host
  ansible.builtin.command:
    argv: [ss, -lntup]
  register: shallot_verify_listening_sockets
  changed_when: false
  failed_when: false

- name: Report verification status
  ansible.builtin.debug:
    msg:
      - "Local-only boundary: PASS"
      - "Rootless Podman: PASS"
      - "Runtime image and secret policy: PASS"
      - >-
        Local secret files: {{ 'CONFIGURED' if
        (shallot_verify_secrets_stat.stat.exists or
        shallot_verify_compose_env_stat.stat.exists or
        shallot_verify_wazuh_internal_users_stat.stat.exists) else 'NOT CONFIGURED' }}
      - "No services, external hosts, VPS systems, or physical SHALLOT devices were modified."
