---
- name: Validate the local SHALLOT lab baseline
  hosts: shallot_lab
  gather_facts: true
  become: false

  roles:
    - role: shallot_preflight
      tags:
        - preflight

  post_tasks:
    - name: Report bootstrap baseline status
      ansible.builtin.debug:
        msg: >-
          Local preflight passed. This baseline does not install packages, create
          Quadlet units, fetch images, modify external hosts, or contact physical
          SHALLOT devices.
