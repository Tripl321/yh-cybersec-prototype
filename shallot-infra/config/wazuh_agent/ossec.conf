<!-- SHALLOT lab agent configuration.
     Rendered by ansible/scripts/prepare_wazuh_agent.py, which substitutes the
     manager address. The monitoring policy is deliberately empty: this
     increment only proves the agent-to-manager hop (ADR 0018). The agent's
     own status events reach the manager, which turns them into alerts that
     carry the agent id. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <email_notification>no</email_notification>
  </global>

  <client>
    <server>
      <address>{{MANAGER_ADDRESS}}</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- The manager enrolls without a password in this lab, and the agent does
       not verify the manager certificate, so no SSL material is needed. -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <use_password>no</use_password>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>
</ossec_config>
