# Explicit local-only TLS overlay. Opt-in; never start implicitly.
# Requires SHALLOT_WAZUH_TLS_DIR to point to local TLS material.
services:
  wazuh-indexer:
    environment:
      - plugins.security.ssl.transport.pemcert_filepath=/etc/wazuh-indexer/certs/indexer.pem
      - plugins.security.ssl.transport.pemkey_filepath=/etc/wazuh-indexer/certs/indexer-key.pem
      - plugins.security.ssl.transport.pemtrustedcas_filepath=/etc/wazuh-indexer/certs/root-ca.pem
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.http.pemcert_filepath=/etc/wazuh-indexer/certs/indexer.pem
      - plugins.security.ssl.http.pemkey_filepath=/etc/wazuh-indexer/certs/indexer-key.pem
      - plugins.security.ssl.http.pemtrustedcas_filepath=/etc/wazuh-indexer/certs/root-ca.pem
      - plugins.security.ssl.http.enabled_protocols=TLSv1.2,TLSv1.3
      - plugins.security.ssl.http.clientauth_mode=OPTIONAL
    volumes:
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_DIR}/ca.crt
        target: /etc/wazuh-indexer/certs/root-ca.pem
        read_only: true
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_DIR}/wazuh-indexer.crt
        target: /etc/wazuh-indexer/certs/indexer.pem
        read_only: true
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_DIR}/wazuh-indexer.key
        target: /etc/wazuh-indexer/certs/indexer-key.pem
        read_only: true
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_DIR}/admin/admin.crt
        target: /etc/wazuh-indexer/certs/admin.pem
        read_only: true
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_DIR}/admin/admin.key
        target: /etc/wazuh-indexer/certs/admin-key.pem
        read_only: true
