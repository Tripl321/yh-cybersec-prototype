# Explicit local-only TLS overlay. Opt-in; never start implicitly.
# Strategy B (ADR 0015): the wrapper stages certificates from
# SHALLOT_WAZUH_TLS_INPUT_DIR (official wazuh-certs-tool layout) into the
# container-owned path.conf directory, and a corrected opensearch.yml points
# the SSL settings at that directory. Env-based SSL settings are inert in this
# image (rpm distribution, no env->-E conversion). No certificate or key is
# bind-mounted.
services:
  wazuh-indexer:
    # keepid maps the host user to container UID 1000, so the wrapper can read
    # the read-only host input directory and stage into the image user's own
    # 0700 path.conf without any capabilities (cap_drop ALL is preserved).
    userns_mode: keep-id
    entrypoint:
      - /usr/local/bin/wazuh-indexer-runtime-wrapper.sh
    environment:
      - WAZUH_TLS_INPUT_DIR=/run/wazuh-tls-input
    volumes:
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_INPUT_DIR:?SHALLOT_WAZUH_TLS_INPUT_DIR is required}
        target: /run/wazuh-tls-input
        read_only: true
      - type: bind
        source: ./config/wazuh_indexer/opensearch.yml
        target: /usr/share/wazuh-indexer/opensearch.yml
        read_only: true
      - type: bind
        source: ../ansible/scripts/wazuh-indexer-runtime-wrapper.sh
        target: /usr/local/bin/wazuh-indexer-runtime-wrapper.sh
        read_only: true

  wazuh:
    # Official wazuh-docker 4.9.0 model: the manager image configures filebeat
    # from these variables (init script 1-config-filebeat). The indexer name
    # must match the certificate SAN (DNS:wazuh-indexer.local) or full
    # verification fails.
    environment:
      - INDEXER_URL=https://wazuh-indexer.local:9200
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
    volumes:
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_INPUT_DIR:?SHALLOT_WAZUH_TLS_INPUT_DIR is required}/root-ca.pem
        target: /etc/ssl/root-ca.pem
        read_only: true
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_INPUT_DIR:?SHALLOT_WAZUH_TLS_INPUT_DIR is required}/filebeat/filebeat.pem
        target: /etc/ssl/filebeat.pem
        read_only: true
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_INPUT_DIR:?SHALLOT_WAZUH_TLS_INPUT_DIR is required}/filebeat/filebeat-key.pem
        target: /etc/ssl/filebeat.key
        read_only: true
