# Explicit local-only TLS overlay. Opt-in; never start implicitly.
# Strategy B (ADR 0015): the wrapper stages certificates from
# SHALLOT_WAZUH_TLS_INPUT_DIR (official wazuh-certs-tool layout) into the
# container-owned path.conf directory. No certificate or key is bind-mounted.
services:
  wazuh-indexer:
    user: "0:0"
    entrypoint:
      - /usr/local/bin/wazuh-indexer-runtime-wrapper.sh
    environment:
      - WAZUH_TLS_INPUT_DIR=/run/wazuh-tls-input
      - plugins.security.ssl.transport.pemcert_filepath=/usr/share/wazuh-indexer/certs/indexer.pem
      - plugins.security.ssl.transport.pemkey_filepath=/usr/share/wazuh-indexer/certs/indexer-key.pem
      - plugins.security.ssl.transport.pemtrustedcas_filepath=/usr/share/wazuh-indexer/certs/root-ca.pem
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.http.pemcert_filepath=/usr/share/wazuh-indexer/certs/indexer.pem
      - plugins.security.ssl.http.pemkey_filepath=/usr/share/wazuh-indexer/certs/indexer-key.pem
      - plugins.security.ssl.http.pemtrustedcas_filepath=/usr/share/wazuh-indexer/certs/root-ca.pem
      - plugins.security.ssl.http.enabled_protocols=TLSv1.2,TLSv1.3
      - plugins.security.ssl.http.clientauth_mode=OPTIONAL
    volumes:
      - type: bind
        source: ${SHALLOT_WAZUH_TLS_INPUT_DIR:?SHALLOT_WAZUH_TLS_INPUT_DIR is required}
        target: /run/wazuh-tls-input
        read_only: true
      - type: bind
        source: ../ansible/scripts/wazuh-indexer-runtime-wrapper.sh
        target: /usr/local/bin/wazuh-indexer-runtime-wrapper.sh
        read_only: true
