# SHALLOT Infrastructure — Podman Compose development reference
# ADR 0005: rootless Podman; ADR 0007: OSS stack
# Immutable image identities are recorded in versions.yml.
# Wazuh is disabled by default and requires an explicit secure profile.

services:
  cub:
    build:
      context: ../cub
      dockerfile: Containerfile
    container_name: shallot-cub
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CUB_CLOUD_ENABLED=0
      - HANKO_API_URL=http://hanko:8000
      - SUPERMEMORY_API_URL=http://supermemory:6767
    networks:
      - shallot-internal
    depends_on:
      - ollama
      - hanko
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:size=100M
    volumes:
      - cub-data:/var/lib/cub
      - cub-provenance:/var/lib/cub/provenance

  ollama:
    image: "ollama/ollama:0.40.5@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241"
    container_name: shallot-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - shallot-internal
    volumes:
      - ollama-data:/root/.ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID

  hanko:
    image: "ghcr.io/teamhanko/hanko:v3.1.2@sha256:51dd4b4d64106aec46b0850605fe86ea3349e82fac8b2d86b7653219c7ff7da3"
    container_name: shallot-hanko
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8888:8888"
    environment:
      - HANKO_CONFIG=/etc/hanko/config.yaml
    networks:
      - shallot-internal
    volumes:
      - hanko-data:/var/lib/hanko
      - ./config/hanko.yaml:/etc/hanko/config.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  supermemory:
    image: "supermemory/supermemory:0.0.9@sha256:557781468b448da518a0d45eacc0ff894bd7847769aa8a20023db2d51d6cef43"
    container_name: shallot-supermemory
    restart: unless-stopped
    ports:
      - "127.0.0.1:6767:6767"
    networks:
      - shallot-internal
    volumes:
      - supermemory-data:/var/lib/supermemory
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  wazuh-indexer:
    profiles: ["wazuh-secure"]
    image: "wazuh/wazuh-indexer:4.9.0@sha256:a7adcac99648b73e075c4fa8daa5bd552da46ec4a7700d7faccd579a2c5e7cc2"
    container_name: shallot-wazuh-indexer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - shallot-internal
    volumes:
      - wazuh-indexer-data:/usr/share/wazuh-indexer/data
      - "./config/wazuh_indexer/internal_users.local.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK

  wazuh:
    profiles: ["wazuh-secure"]
    image: "wazuh/wazuh-manager:4.9.0@sha256:e0a78683d35556465d599a923ddc2eaec38110f911fc2c82e578f7c4ab038004"
    container_name: shallot-wazuh
    restart: unless-stopped
    depends_on:
      - wazuh-indexer
    ports:
      - "127.0.0.1:55000:55000"
      - "127.0.0.1:1514:1514/udp"
      - "127.0.0.1:1515:1515"
    environment:
      - INDEXER_URL=http://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - "INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?WAZUH_INDEXER_PASSWORD is required}"
    networks:
      - shallot-internal
    volumes:
      - wazuh-data:/var/ossec/data
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  shallot-internal:
    driver: bridge
    internal: true

volumes:
  cub-data:
  cub-provenance:
  ollama-data:
  hanko-data:
  supermemory-data:
  wazuh-data:
  wazuh-etc:
  wazuh-logs:
  wazuh-indexer-data:
