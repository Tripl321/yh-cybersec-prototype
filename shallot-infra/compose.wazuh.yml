# Explicit secure Wazuh overlay.
# Use only after the local password and complete internal_users file are reviewed.

services:
  wazuh-indexer:
    profiles: ["wazuh-secure"]
    image: "wazuh/wazuh-indexer:4.9.0@sha256:a7adcac99648b73e075c4fa8daa5bd552da46ec4a7700d7faccd579a2c5e7cc2"
    container_name: shallot-wazuh-indexer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      # 4.9.0 needs ~291MB direct buffer memory; 512m heap OOMs (measured).
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    networks:
      shallot-internal:
        # The indexer certificate SAN is DNS:wazuh-indexer.local only, so TLS
        # clients must reach it under that name to keep hostname verification
        # on. The alias resolves it on the compose network; no regeneration.
        aliases:
          - wazuh-indexer.local
    volumes:
      - wazuh-indexer-data:/usr/share/wazuh-indexer/data
      - "${SHALLOT_WAZUH_CONFIG_DIR:-./config/wazuh_indexer}/internal_users.local.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro"
      - "${SHALLOT_WAZUH_CONFIG_DIR:-./config/wazuh_indexer}/roles_mapping.yml:/usr/share/wazuh-indexer/opensearch-security/roles_mapping.yml:ro"
      - "${SHALLOT_WAZUH_CONFIG_DIR:-./config/wazuh_indexer}/roles.yml:/usr/share/wazuh-indexer/opensearch-security/roles.yml:ro"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK

  wazuh:
    profiles: ["wazuh-secure"]
    image: "wazuh/wazuh-manager:4.9.0@sha256:e0a78683d35556465d599a923ddc2eaec38110f911fc2c82e578f7c4ab038004"
    container_name: shallot-wazuh
    restart: unless-stopped
    depends_on:
      - wazuh-indexer
    ports:
      - "127.0.0.1:55000:55000"
      - "127.0.0.1:1514:1514/tcp"
      - "127.0.0.1:1514:1514/udp"
      - "127.0.0.1:1515:1515"
    environment:
      - INDEXER_URL=http://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - "INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:?WAZUH_INDEXER_PASSWORD is required}"
    networks:
      - shallot-internal
    volumes:
      - wazuh-data:/var/ossec/data
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - type: bind
        source: ../shallot-infra/scripts/05-fix-wazuh-uid.sh
        target: /usr/local/bin/fix-wazuh-uid.sh
        read_only: true
    # The manager image starts as root and its init copies the permanent data
    # into the volumes, then drops to the wazuh user. Under rootless Podman
    # that needs keep-id and the ownership capabilities; the image entrypoint
    # runs securityadmin only in a commented-out block.
    userns_mode: keep-id
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - SYS_CHROOT
      - KILL
