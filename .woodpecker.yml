---
when:
  - event: pull_request
    branch: main

steps:
  - name: validate-shallot
    image: python:3.13.7-slim-bookworm@sha256:adafcc17694d715c905b4c7bebd96907a1fd5cf183395f0ebc4d3428bd22d92d
    commands:
      - python -m pip install --disable-pip-version-check --no-cache-dir ansible-core==2.21.5 ansible-lint==26.10.0 yamllint==1.38.0
      - python -m pip install --disable-pip-version-check --no-cache-dir -e './hardware/contact-auth[test]'
      - python hardware/contact-auth/tools/check_pytest_baseline.py
      - python -m pytest tests/test_cub_scrubber.py -q
      - python -m pytest tests/test_wazuh_tls_overlay.py tests/test_wazuh_runtime_wrapper.py tests/test_wazuh_manager_runtime.py tests/test_wazuh_bootstrap_credentials.py -q
      - python -c "from pathlib import Path; assert 'COPY . .' not in Path('agent-platform/Dockerfile').read_text()"
      - cd ansible
      - yamllint --config-file .yamllint.yml .
      - python scripts/check_runtime_policy.py
      - python -m py_compile scripts/bootstrap_wazuh_credentials.py
      - ANSIBLE_CONFIG=./ansible.cfg ansible-lint --config-file .ansible-lint
      - ANSIBLE_CONFIG=./ansible.cfg ansible-playbook playbooks/site.yml --syntax-check
      - ANSIBLE_CONFIG=./ansible.cfg ansible-playbook playbooks/verify.yml --syntax-check
      - ANSIBLE_CONFIG=./ansible.cfg ansible-playbook playbooks/bootstrap_wazuh.yml --syntax-check
