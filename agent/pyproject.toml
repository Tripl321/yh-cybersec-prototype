[project]
name = "shallot-harness"
version = "0.1.0"
description = "Standalone SHALLOT agent harness"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.12,<3", "pydantic-ai-slim[ollama]>=0.3,<1", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mcp>=1.0,<2"]

[project.optional-dependencies]
web = ["pydantic-ai[web]>=0.3,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shallot_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
