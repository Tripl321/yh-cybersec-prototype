[project]
name = "shallot-setup-backend"
version = "0.1.0"
description = "SHALLOT installer backend — USB detection, firmware flashing, config deployment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
